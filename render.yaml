services:
  - type: web
    name: tapehawk
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # ONE worker, deliberately. Each worker would open its own Alpaca socket
    # and write the same headlines to the same database. The work per request
    # here is tiny, so one worker is plenty.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      # Optional: rtpr.io alert socket (all four press-release wires). Set in the dashboard only.
      - key: RTPR_KEY
        sync: false
      # Which optional tabs are on, as a comma list of halts, filings, gems.
      # Empty = Halts, SEC Filings and Hidden Gems are off (their pages say so,
      # their APIs answer 404, the EDGAR watcher and the gems screener do not
      # run). The bot's halt record (/api/halts and the Nasdaq halt poller)
      # keeps running whatever this says.
      - key: TAPEHAWK_TABS
        value: ""
